# This workflow will make sure the code is linted and valid

name: Validate

on:
  push:
    branches:
      - '**'
      - '!main'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  validate:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
      - name: Lint JS
        run: pnpm lint --deny-warnings
      - name: Build app
        run: pnpm build
